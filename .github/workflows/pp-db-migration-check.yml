name: PP DB Migration Check

on:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production DB schema migration
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS https://pp-gateway-proof-runner-production.up.railway.app/)
            echo "$body"
            case "$body" in
              *PP_DB_VERIFYING_STATUS_MIGRATION=PASS*) exit 0 ;;
              *PP_DB_VERIFYING_STATUS_MIGRATION=FAIL*) exit 1 ;;
            esac
            sleep 5
          done
          exit 2

# recheck production database schema
