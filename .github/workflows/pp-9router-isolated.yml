name: PP 9router Isolated Transport Proof

on:
  push:
    paths:
      - ".github/workflows/pp-9router-isolated.yml"

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Run isolated 9router proof
        env:
          PP_API: https://pp-api-production-24bc.up.railway.app
        run: |
          node <<'NODE'
          const API = process.env.PP_API;
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          async function req(path, opts = {}) {
            const res = await fetch(API + path, {
              ...opts,
              headers: { "content-type": "application/json", ...(opts.headers || {}) }
            });
            const body = await res.text();
            let data;
            try { data = body ? JSON.parse(body) : null; } catch { data = { raw: body }; }
            return { status: res.status, data };
          }

          async function waitTask(sessionId, taskId, timeoutMs = 600000) {
            const started = Date.now();
            while (Date.now() - started < timeoutMs) {
              const r = await req('/prototype/sessions/' + sessionId);
              const task = (r.data?.tasks || []).find(t => t.id === taskId);
              if (task && ['COMPLETED', 'FAILED', 'CANCELLED'].includes(task.status)) return task;
              await sleep(3000);
            }
            return { id: taskId, status: 'TIMEOUT' };
          }

          const suffix = Date.now();
          let r = await req('/prototype/auth/signup', {
            method: 'POST',
            body: JSON.stringify({
              email: 'pp-9router-isolated-' + suffix + '@pubcore.test',
              password: 'PPProof!' + suffix + 'aZ9',
              name: 'PP 9router Isolated Proof'
            })
          });
          console.log(JSON.stringify({stage:'SIGNUP',status:r.status}));
          if (r.status !== 201) process.exit(2);

          const token = r.data.accessToken;

          r = await req('/prototype/auth/workspaces', {
            method: 'POST',
            headers: { authorization: 'Bearer ' + token },
            body: JSON.stringify({
              name: 'PP 9router Isolated Workspace',
              slug: 'pp-9router-isolated-' + suffix
            })
          });
          console.log(JSON.stringify({stage:'WORKSPACE',status:r.status}));
          if (r.status !== 201) process.exit(3);

          const workspaceId = r.data.id;
          r = await req('/api/workspaces/' + workspaceId + '/projects', {
            method: 'POST',
            headers: { authorization: 'Bearer ' + token },
            body: JSON.stringify({name:'PP 9router Isolated Project'})
          });
          console.log(JSON.stringify({stage:'PROJECT',status:r.status}));
          if (r.status !== 201) process.exit(4);

          const projectId = r.data.id;
          r = await req('/prototype/sessions', {
            method: 'POST',
            body: JSON.stringify({project:'PP 9router Isolated Project',projectId})
          });
          console.log(JSON.stringify({stage:'SESSION',status:r.status,sessionId:r.data?.id||null}));
          if (r.status !== 201) process.exit(5);

          const sessionId = r.data.id;
          r = await req('/prototype/sessions/' + sessionId + '/prompts', {
            method: 'POST',
            headers: { authorization: 'Bearer ' + token },
            body: JSON.stringify({
              objective:'PP 9router Isolated Transport Proof',
              prompt: JSON.stringify({
                modelOverride:'kc/cohere/north-mini-code:free',
                prompt:'Return exactly PP_9ROUTER_TRANSPORT_OK. Do not call any tools. Do not modify files. Do not ask questions.'
              })
            })
          });
          console.log(JSON.stringify({stage:'TASK_CREATED',status:r.status,taskId:r.data?.task?.id||r.data?.id||null}));
          if (r.status !== 202) process.exit(6);

          const taskId = r.data?.task?.id || r.data?.id;
          const task = await waitTask(sessionId,taskId);

          console.log(JSON.stringify({
            stage:'TASK_RESULT',
            taskId:task.id,
            status:task.status,
            error:task.error||null,
            provider:task.result?.provider||null,
            model:task.result?.model||null,
            exitCode:task.result?.exitCode||null,
            errorCode:task.result?.errorCode||null,
            errorMessage:task.result?.errorMessage||null,
            stderr:task.result?.stderr||null,
            stdout:task.result?.stdout||null,
            httpStatus:task.result?.httpStatus||null,
            toolCalls:task.result?.toolCalls||null,
            toolRounds:task.result?.toolRounds||null
          }));
          NODE
