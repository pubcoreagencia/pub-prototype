name: PP CI Proof

on:
  push:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: git config --global user.name "PP CI Test" && git config --global user.email "ci@pubcore.test"
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
